<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Home — Rise of Village</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --wood: #8B5A2B;
    --stone: #7A8B99;
    --gold: #F5B041;
    --food: #E67E22;
    --dark: #2C3E50;
    --panel-bg: rgba(30, 40, 50, 0.92);
    --panel-border: rgba(255, 215, 0, 0.3);
  }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background-color: #1a1a1a;
    color: #fff;
    overflow: hidden; /* Убираем скролл, карта на весь экран */
    user-select: none;
    height: 100vh;
    width: 100vw;
  }

  /* ==== ГЛАВНЫЙ ЭКРАН КАРТЫ ==== */
  .game-world {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle at center, #5E8C61 0%, #3D5A40 100%);
    overflow: hidden;
    cursor: grab;
  }
  .game-world:active { cursor: grabbing; }
  
  /* Изометрическая сетка (земля) */
  .grid {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotateX(60deg) rotateZ(45deg);
    transform-style: preserve-3d;
    display: grid;
    grid-template-columns: repeat(20, 80px);
    grid-template-rows: repeat(20, 80px);
    gap: 2px;
    opacity: 0.15;
    pointer-events: none;
  }
  .tile {
    background: #8bc34a;
    border: 1px solid #5d8a2c;
    border-radius: 4px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
  }

  /* ==== ОБЪЕКТЫ НА КАРТЕ ==== */
  .entity {
    position: absolute;
    width: 100px; height: 100px;
    transform: translate(-50%, -100%); /* Точка привязки — центр под домом */
    pointer-events: auto;
    cursor: pointer;
    transition: transform 0.2s;
    filter: drop-shadow(0 15px 10px rgba(0,0,0,0.4));
    z-index: 10;
  }
  .entity:hover {
    transform: translate(-50%, -105%) scale(1.05);
    z-index: 20;
  }
  .entity svg {
    width: 100%; height: 100%;
    overflow: visible;
  }
  
  /* Информация над зданием (уровень) */
  .entity-level {
    position: absolute;
    top: 0; right: 10px;
    background: linear-gradient(180deg, #FFD700, #FFA500);
    color: #333;
    font-weight: 900;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    border: 2px solid #fff;
    box-shadow: 0 3px 6px rgba(0,0,0,0.5);
    transform: translateY(-10px);
    z-index: 5;
  }

  /* ==== UI ПАНЕЛИ ==== */
  
  /* Верхняя панель ресурсов */
  .top-bar {
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    display: flex;
    gap: 10px;
    pointer-events: none;
    z-index: 100;
    flex-wrap: wrap;
  }
  
  .res-group {
    display: flex;
    gap: 5px;
    background: var(--panel-bg);
    padding: 5px 10px;
    border-radius: 20px;
    border: 2px solid var(--panel-border);
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    pointer-events: auto;
    backdrop-filter: blur(5px);
  }
  
  .res-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: bold;
    font-size: 14px;
  }
  .res-item img {
    width: 20px; height: 20px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
  }
  .res-item span { color: #eee; text-shadow: 0 1px 2px #000; }

  /* Правая панель (Кнопки) */
  .side-bar {
    position: absolute;
    right: 10px;
    top: 70px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 100;
  }
  
  .btn-circular {
    width: 55px; height: 55px;
    border-radius: 50%;
    background: linear-gradient(180deg, #4A6572, #232F34);
    border: 2px solid #8B9DAF;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s;
    color: white;
    font-size: 24px;
  }
  .btn-circular:hover { transform: scale(1.1); border-color: var(--gold); }
  .btn-circular:active { transform: scale(0.95); }

  /* ==== МОДАЛЬНОЕ ОКНО (МАГАЗИН/УЛУЧШЕНИЯ) ==== */
  .modal-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  
  .modal-content {
    width: 90%;
    max-width: 450px;
    background: linear-gradient(180deg, #2c3e50, #1a252f);
    border: 3px solid var(--gold);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(255,215,0,0.1);
    transform: scale(0.8);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-overlay.active .modal-content { transform: scale(1); }
  
  .modal-title {
    text-align: center;
    color: var(--gold);
    font-size: 24px;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.8);
    border-bottom: 2px solid rgba(255,215,0,0.3);
    padding-bottom: 10px;
  }
  
  /* Список зданий в магазине */
  .shop-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  
  .shop-card {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .shop-card:hover:not(.disabled) {
    background: rgba(255,255,255,0.15);
    border-color: var(--gold);
    transform: translateX(5px);
  }
  .shop-card.disabled {
    opacity: 0.4;
    cursor: not-allowed;
    filter: grayscale(1);
  }
  
  .shop-icon {
    width: 60px; height: 60px;
    flex-shrink: 0;
    margin-right: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .shop-icon svg { width: 100%; height: 100%; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
  
  .shop-info { flex: 1; }
  .shop-name { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 3px; }
  .shop-desc { font-size: 12px; color: #aaa; margin-bottom: 5px; }
  .shop-cost { font-size: 13px; color: #FFD700; font-weight: bold; display: flex; gap: 8px; }
  .shop-cost span { display: flex; align-items: center; gap: 3px; }
  
  /* Кнопка закрытия */
  .btn-close {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: linear-gradient(180deg, #e74c3c, #c0392b);
    color: white;
    border: 2px solid #ff6b6b;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    font-family: inherit;
  }
  .btn-close:active { transform: translateY(2px); box-shadow: none; }

  /* Сообщения (Toast) */
  .toast {
    position: absolute;
    top: 80px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    border: 1px solid var(--gold);
    font-size: 14px;
    font-weight: bold;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 300;
    white-space: nowrap;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Мобильная адаптация */
  @media (max-width: 600px) {
    .entity { width: 80px; height: 80px; }
    .res-group { padding: 4px 8px; }
    .res-item { font-size: 12px; }
    .res-item img { width: 16px; height: 16px; }
    .btn-circular { width: 45px; height: 45px; font-size: 20px; }
    .top-bar { gap: 5px; }
  }
</style>
</head>

}

function loadGame() {
  const saved = localStorage.getItem('myHome_v3');
  if (saved) {
    try { state = JSON.parse(saved); } catch(e) {}
  }
}

// ==================== ЭКОНОМИКА ====================
function getProd() {
  let prod = { food: 0, wood: 0, stone: 0, gold: 0 };
  state.buildings.forEach(b => {
    const base = BUILDINGS[b.type].prod;
    for (let r in base) prod[r] += base[r] * b.level;
  });
  return prod;
}

function updateUI() {
  document.getElementById('ui-food').textContent = Math.floor(state.food);
  document.getElementById('ui-wood').textContent = Math.floor(state.wood);
  document.getElementById('ui-stone').textContent = Math.floor(state.stone);
  document.getElementById('ui-gold').textContent = Math.floor(state.gold);
}

// ==================== РЕНДЕР КАРТЫ ====================
function renderWorld() {
  const world = document.getElementById('gameWorld');
  
  // Удаляем старые здания, оставляем сетку
  document.querySelectorAll('.entity').forEach(e => e.remove());
  
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2 + 100; // Смещаем центр вниз, чтобы дома были видны
  
  state.buildings.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'entity';
    // Позиция на экране
    el.style.left = (centerX + b.x + camera.x) + 'px';
    el.style.top = (centerY + b.y + camera.y) + 'px';
    
    el.innerHTML = `
      ${SPRITES[BUILDINGS[b.type].sprite]}
      <div class="entity-level">${b.level}</div>
    `;
    
    // Клик по зданию — улучшение
    el.onclick = (e) => {
      e.stopPropagation();
      upgradeBuilding(i);
    };
    
    world.appendChild(el);
  });
}

// ==================== МАГАЗИН ====================
let shopMode = 'build'; // 'build' или 'upgrade'
let currentUpgradeIndex = -1;

function openShop() {
  shopMode = 'build';
  document.getElementById('modalTitle').textContent = 'Строительство';
  renderShop();
  document.getElementById('modal').classList.add('active');
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget && e.type === 'click') return;
  document.getElementById('modal').classList.remove('active');
}

function renderShop() {
  const list = document.getElementById('shopList');
  list.innerHTML = '';
  
  if (shopMode === 'build') {
    for (let type in BUILDINGS) {
      const b = BUILDINGS[type];
      
      // Проверка: Ратуша только одна
      if (type === 'cityhall' && state.buildings.some(bld => bld.type === 'cityhall')) continue;
      
      // Проверка ресурсов
      let canAfford = true;
      for (let r in b.cost) if (state[r] < b.cost[r]) canAfford = false;
      
      const el = document.createElement('div');
      el.className = 'shop-card' + (canAfford ? '' : ' disabled');
      el.innerHTML = `
        <div class="shop-icon">${SPRITES[b.sprite]}</div>
        <div class="shop-info">
          <div class="shop-name">${b.name}</div>
          <div class="shop-desc">${b.desc}</div>
          <div class="shop-cost">
            ${b.cost.wood ? `<span>🪵${b.cost.wood}</span>` : ''}
            ${b.cost.stone ? `<span>🪨${b.cost.stone}</span>` : ''}
            ${b.cost.gold ? `<span>🪙${b.cost.gold}</span>` : ''}
          </div>
        </div>
      `;
      
      if (canAfford) {
        el.onclick = () => build(type);
      }
      list.appendChild(el);
    }
  }
}

// ==================== ПОСТРОЙКА И УЛУЧШЕНИЕ ====================
function build(type) {
  const b = BUILDINGS[type];
  
  // Проверка ресурсов
  for (let r in b.cost) {
    if (state[r] < b.cost[r]) { showToast('❌ Не хватает ресурсов!'); return; }
  }
  
  // Списываем
  for (let r in b.cost) state[r] -= b.cost[r];
  
  // Рандомная позиция на карте (в радиусе от центра)
  // Если это ратуша — ставим строго в центр (0,0)
  let px = 0, py = 0;
  if (type !== 'cityhall') {
    // Ищем свободное место
    let attempts = 0;
    do {
      const angle = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 100; // Отступ от ратуши
      px = Math.cos(angle) * dist;
      py = Math.sin(angle) * dist * 0.5; // Изометрия (сплющиваем Y)
      attempts++;
    } while (checkOverlap(px, py) && attempts < 50);
  }
  
  state.buildings.push({ type, x: px, y: py, level: 1 });
  
  showToast(`✅ ${b.name} построен!`);
  closeModal();
  renderWorld();
  updateUI();
  saveGame();
}

function checkOverlap(x, y) {
  // Простая проверка, чтобы дома не накладывались
  return state.buildings.some(b => {
    const dx = Math.abs(b.x - x);
    const dy = Math.abs(b.y - y);
    return dx < 40 && dy < 20;
  });
}

function upgradeBuilding(index) {
  const b = state.buildings[index];
  const bDef = BUILDINGS[b.type];
  
  // Стоимость улучшения = базовая * 1.5^уровень
  const mult = Math.pow(1.6, b.level);
  const cost = {
    wood: Math.floor((bDef.cost.wood || 0) * mult),
    stone: Math.floor((bDef.cost.stone || 0) * mult),
    gold: Math.floor((bDef.cost.gold || 0) * mult)
  };
  
  // Проверка
  let canAfford = true;
  for (let r in cost) {
    if (cost[r] > 0 && state[r] < cost[r]) canAfford = false;
  }
  
  if (!canAfford) {
    showToast(`❌ Нужно на улучшение: 🪵${cost.wood} 🪨${cost.stone} 🪙${cost.gold}`);
    return;
  }
  
  // Списываем и улучшаем
  for (let r in cost) if (cost[r] > 0) state[r] -= cost[r];
  b.level++;
  
  showToast(`⬆️ ${bDef.name} улучшен до ур. ${b.level}`);
  renderWorld();
  updateUI();
  saveGame();
}

// ==================== ТОСТЫ ====================
let toastTimeout;
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 2500);
}

// ==================== СБРОС ====================
function resetGame() {
  if (confirm('Сбросить игру?')) {
    localStorage.removeItem('myHome_v3');
    state = { food: 200, wood: 200, stone: 100, gold: 50, buildings: [], soundOn: true };
    renderWorld();
    updateUI();
    showToast('🔄 Игра сброшена');
  }
}

// ==================== ИГРОВОЙ ЦИКЛ ====================
function gameTick() {
  const prod = getProd();
  state.food += prod.food;
  state.wood += prod.wood;
  state.stone += prod.stone;
  state.gold += prod.gold;
  
  // Расход еды (если есть дома)
  state.food -= state.buildings.length * 0.5;
  if (state.food < 0) state.food = 0;
  
  updateUI();
}

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
function init() {
  loadGame();
  
  // Генерируем изометрическую сетку земли
  const grid = document.getElementById('grid');
  for (let i = 0; i < 400; i++) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    // Случайные пятна травы
    tile.style.background = Math.random() > 0.8 ? '#7cb342' : '#8bc34a';
    grid.appendChild(tile);
  }
  
  // Если зданий нет — автоматически ставим Ратушу (как в RoK)
  if (state.buildings.length === 0) {
    state.buildings.push({ type: 'cityhall', x: 0, y: 0, level: 1 });
  }
  
  renderWorld();
  updateUI();
  
  // Запускаем цикл
  setInterval(gameTick, 1000);
  
  // Обработка перетаскивания карты
  const world = document.getElementById('gameWorld');
  world.addEventListener('mousedown', (e) => {
    if (e.target.closest('.entity') || e.target.closest('.btn-circular')) return;
    camera.isDragging = true;
    camera.startX = e.clientX - camera.x;
    camera.startY = e.clientY - camera.y;
  });
  window.addEventListener('mousemove', (e) => {
    if (!camera.isDragging) return;
    camera.x = e.clientX - camera.startX;
    camera.y = e.clientY - camera.startY;
    renderWorld();
  });
  window.addEventListener('mouseup', () => camera.isDragging = false);
  
  // Мобильная адаптация для перетаскивания
  world.addEventListener('touchstart', (e) => {
    if (e.target.closest('.entity')) return;
    camera.isDragging = true;
    camera.startX = e.touches[0].clientX - camera.x;
    camera.startY = e.touches[0].clientY - camera.y;
  }, {passive: true});
  window.addEventListener('touchmove', (e) => {
    if (!camera.isDragging) return;
    camera.x = e.touches[0].clientX - camera.startX;
    camera.y = e.touches[0].clientY - camera.startY;
    renderWorld();
  }, {passive: true});
  window.addEventListener('touchend', () => camera.isDragging = false);
}

init();
</script>
