<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Home — Rise of Village</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #1a1a1a;
    color: #fff;
    overflow: hidden;
    user-select: none;
    height: 100vh; width: 100vw;
  }

  /* ==== КАРТА ==== */
  .game-world {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, #6c9e6e 0%, #4a7c4e 40%, #2d4f30 100%);
    overflow: hidden;
    cursor: grab;
  }
  .game-world:active { cursor: grabbing; }
  .game-world.placing { cursor: crosshair; }

  /* Изометрическая земля */
  .ground {
    position: absolute;
    width: 200%; height: 200%;
    top: -50%; left: -50%;
    background-image: 
      linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%),
      linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%);
    background-size: 120px 120px;
    background-position: 0 0, 60px 60px;
    opacity: 0.5;
    pointer-events: none;
  }

  /* ==== ЗДАНИЯ ==== */
  .entity {
    position: absolute;
    width: 140px; height: 140px;
    transform: translate(-50%, -85%);
    cursor: pointer;
    transition: filter 0.2s;
    z-index: 10;
    filter: drop-shadow(0 20px 15px rgba(0,0,0,0.5));
  }
  .entity:hover {
    filter: drop-shadow(0 25px 20px rgba(0,0,0,0.7)) brightness(1.15);
    z-index: 20;
  }
  .entity svg {
    width: 100%; height: 100%;
    overflow: visible;
  }

  /* Уровень */
  .entity-level {
    position: absolute;
    top: 5px; right: 5px;
    background: linear-gradient(180deg, #FFD700, #FFA500, #CC8400);
    color: #fff;
    font-weight: 900;
    font-size: 13px;
    padding: 3px 9px;
    border-radius: 12px;
    border: 2px solid #fff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.5);
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    z-index: 5;
  }

  /* Тень от объекта на земле */
  .entity-shadow {
    position: absolute;
    bottom: -5px; left: 50%;
    transform: translateX(-50%);
    width: 100px; height: 25px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.4) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
  }

  /* ==== ПРИЗРАК (при постановке дома) ==== */
  .ghost {
    position: absolute;
    width: 140px; height: 140px;
    transform: translate(-50%, -85%);
    pointer-events: none;
    opacity: 0.6;
    z-index: 100;
    filter: drop-shadow(0 20px 15px rgba(0,0,0,0.5));
  }
  .ghost svg { width: 100%; height: 100%; overflow: visible; }
  .ghost .ghost-shadow {
    position: absolute;
    bottom: -5px; left: 50%;
    transform: translateX(-50%);
    width: 100px; height: 25px;
    background: radial-gradient(ellipse, rgba(0,255,0,0.4) 0%, transparent 70%);
    border-radius: 50%;
  }
  .ghost.invalid .ghost-shadow {
    background: radial-gradient(ellipse, rgba(255,0,0,0.5) 0%, transparent 70%);
  }
  .ghost.invalid svg { filter: hue-rotate(0deg) brightness(0.8) sepia(1) saturate(5) hue-rotate(-50deg); }

  /* ==== UI ==== */
  .top-bar {
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    display: flex;
    gap: 8px;
    pointer-events: none;
    z-index: 100;
    flex-wrap: wrap;
  }
  .res-group {
    display: flex; gap: 5px;
    background: linear-gradient(180deg, rgba(30,40,50,0.95), rgba(15,20,25,0.95));
    padding: 6px 12px;
    border-radius: 20px;
    border: 2px solid rgba(255,215,0,0.4);
    box-shadow: 0 4px 15px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.15);
    pointer-events: auto;
    backdrop-filter: blur(5px);
  }
  .res-item {
    display: flex; align-items: center; gap: 5px;
    font-weight: bold; font-size: 14px;
    color: #eee;
    text-shadow: 0 1px 2px #000;
  }

  .side-bar {
    position: absolute;
    right: 10px; top: 70px;
    display: flex; flex-direction: column; gap: 10px;
    z-index: 100;
  }
  .btn-circular {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: linear-gradient(180deg, #4A6572, #232F34);
    border: 3px solid #8B9DAF;
    box-shadow: 0 6px 15px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    color: white;
    font-size: 26px;
  }
  .btn-circular:hover { transform: scale(1.1); border-color: #FFD700; }
  .btn-circular:active { transform: scale(0.95); }

  /* ==== МОДАЛКА ==== */
  .modal-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-content {
    width: 92%; max-width: 480px;
    background: linear-gradient(180deg, #2c3e50, #1a252f);
    border: 3px solid #FFD700;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(255,215,0,0.1);
    transform: scale(0.85);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-overlay.active .modal-content { transform: scale(1); }
  .modal-title {
    text-align: center;
    color: #FFD700;
    font-size: 22px;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.8);
    border-bottom: 2px solid rgba(255,215,0,0.3);
    padding-bottom: 10px;
  }
  .shop-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .shop-card {
    display: flex; align-items: center;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .shop-card:hover:not(.disabled) {
    background: rgba(255,255,255,0.15);
    border-color: #FFD700;
    transform: translateX(5px);
  }
  .shop-card.disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
  .shop-icon {
    width: 70px; height: 70px;
    flex-shrink: 0; margin-right: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .shop-icon svg { width: 100%; height: 100%; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
  .shop-info { flex: 1; }
  .shop-name { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 3px; }
  .shop-desc { font-size: 12px; color: #aaa; margin-bottom: 5px; }
  .shop-cost { font-size: 13px; color: #FFD700; font-weight: bold; display: flex; gap: 8px; flex-wrap: wrap; }
  .shop-cost span { display: flex; align-items: center; gap: 3px; }
  .shop-cost span.bad { color: #e74c3c; }
  .btn-close {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: linear-gradient(180deg, #e74c3c, #c0392b);
    color: white;
    border: 2px solid #ff6b6b;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    font-family: inherit;
  }
  .btn-close:active { transform: translateY(2px); box-shadow: none; }

  /* Тост */
  .toast {
    position: absolute;
    top: 80px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,0.9);
    color: #fff;
    padding: 12px 24px;
    border-radius: 25px;
    border: 2px solid #FFD700;
    font-size: 14px;
    font-weight: bold;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 300;
    box-shadow: 0 5px 20px rgba(0,0,0,0.6);
    max-width: 90%;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Подсказка постановки */
  .place-hint {
    position: absolute;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: #FFD700;
    padding: 12px 24px;
    border-radius: 25px;
    border: 2px solid #FFD700;
    font-size: 14px;
    font-weight: bold;
    z-index: 150;
    display: none;
    box-shadow: 0 5px 20px rgba(0,0,0,0.6);
    text-align: center;
    max-width: 90%;
  }
  .place-hint.active { display: block; }
  .place-hint button {
    margin-left: 10px;
    background: #e74c3c;
    color: white;
    border: none;
    padding: 5px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    font-family: inherit;
  }

  @media (max-width: 600px) {
    .entity, .ghost { width: 110px; height: 110px; }
    .res-group { padding: 4px 8px; }
    .res-item { font-size: 12px; }
    .btn-circular { width: 50px; height: 50px; font-size: 22px; }
    .shop-icon { width: 55px; height: 55px; }
  }
</style>
</head>
<body>

<div class="game-world" id="gameWorld">
  <div class="ground" id="ground"></div>
</div>

<div class="top-bar">
  <div class="res-group"><div class="res-item">🍖 <span id="ui-food">0</span></div></div>
  <div class="res-group"><div class="res-item">🪵 <span id="ui-wood">0</span></div></div>
  <div class="res-group"><div class="res-item">🪨 <span id="ui-stone">0</span></div></div>
  <div class="res-group"><div class="res-item">🪙 <span id="ui-gold">0</span></div></div>
</div>

<div class="side-bar">
  <div class="btn-circular" onclick="openShop()" title="Строительство">🔨</div>
  <div class="btn-circular" onclick="saveGame()" title="Сохранить">💾</div>
  <div class="btn-circular" onclick="centerCamera()" title="Центр">🎯</div>
  <div class="btn-circular" onclick="resetGame()" title="Сброс">🔄</div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-title" id="modalTitle">Строительство</div>
    <div class="shop-grid" id="shopList"></div>
    <button class="btn-close" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="place-hint" id="placeHint">
  📍 Нажми на карту, чтобы поставить здание
  <button onclick="cancelPlacement()">Отмена</button>
</div>

  academy:  { name: 'Академия', sprite: 'academy', cost: { wood: 150, stone: 100, gold: 100 }, prod: {}, desc: 'Технологии' }
};

// ==================== СОСТОЯНИЕ ====================
let state = {
  food: 500, wood: 500, stone: 200, gold: 100,
  buildings: []
};

let camera = { x: 0, y: 0, isDragging: false, startX: 0, startY: 0, moved: false };
let placingMode = null; // тип здания в режиме постановки
let ghostEl = null;

// ==================== СОХРАНЕНИЕ ====================
function saveGame() {
  localStorage.setItem('myHome_v4', JSON.stringify(state));
  showToast('💾 Сохранено!');
}
function loadGame() {
  const s = localStorage.getItem('myHome_v4');
  if (s) try { state = JSON.parse(s); } catch(e) {}
}

// ==================== РЕНДЕР ====================
function renderWorld() {
  const world = document.getElementById('gameWorld');
  document.querySelectorAll('.entity').forEach(e => e.remove());
  
  const cx = window.innerWidth / 2 + camera.x;
  const cy = window.innerHeight / 2 + camera.y + 100;
  
  state.buildings.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'entity';
    el.style.left = (cx + b.x) + 'px';
    el.style.top = (cy + b.y) + 'px';
    el.style.zIndex = Math.floor(b.y + 1000);
    el.innerHTML = `
      ${SPRITES[BUILDINGS[b.type].sprite]}
      <div class="entity-level">${b.level}</div>
    `;
    el.onclick = (e) => {
      e.stopPropagation();
      if (camera.moved) return;
      upgradeBuilding(i);
    };
    world.appendChild(el);
  });
}

// ==================== МАГАЗИН ====================
function openShop() {
  cancelPlacement();
  document.getElementById('modalTitle').textContent = '🏗️ Строительство';
  const list = document.getElementById('shopList');
  list.innerHTML = '';
  
  for (let type in BUILDINGS) {
    if (type === 'cityhall') continue;
    const b = BUILDINGS[type];
    
    let canAfford = true;
    for (let r in b.cost) if (state[r] < b.cost[r]) canAfford = false;
    
    const el = document.createElement('div');
    el.className = 'shop-card' + (canAfford ? '' : ' disabled');
    el.innerHTML = `
      <div class="shop-icon">${SPRITES[b.sprite]}</div>
      <div class="shop-info">
        <div class="shop-name">${b.name}</div>
        <div class="shop-desc">${b.desc}</div>
        <div class="shop-cost">
          ${b.cost.wood ? `<span class="${state.wood < b.cost.wood ? 'bad' : ''}">🪵${b.cost.wood}</span>` : ''}
          ${b.cost.stone ? `<span class="${state.stone < b.cost.stone ? 'bad' : ''}">🪨${b.cost.stone}</span>` : ''}
          ${b.cost.gold ? `<span class="${state.gold < b.cost.gold ? 'bad' : ''}">🪙${b.cost.gold}</span>` : ''}
        </div>
      </div>
    `;
    if (canAfford) el.onclick = () => startPlacement(type);
    list.appendChild(el);
  }
  
  document.getElementById('modal').classList.add('active');
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget && e.type === 'click') return;
  document.getElementById('modal').classList.remove('active');
}

// ==================== РЕЖИМ ПОСТАНОВКИ ====================
function startPlacement(type) {
  closeModal();
  placingMode = type;
  
  // Создаём призрак
  if (!ghostEl) {
    ghostEl = document.createElement('div');
    ghostEl.className = 'ghost';
    document.getElementById('gameWorld').appendChild(ghostEl);
  }
  ghostEl.innerHTML = SPRITES[BUILDINGS[type].sprite] + '<div class="ghost-shadow"></div>';
  ghostEl.style.display = 'block';
  
  document.getElementById('gameWorld').classList.add('placing');
  document.getElementById('placeHint').classList.add('active');
  
  showToast(`📍 Выбери место для ${BUILDINGS[type].name}`);
}

function cancelPlacement() {
  placingMode = null;
  if (ghostEl) ghostEl.style.display = 'none';
  document.getElementById('gameWorld').classList.remove('placing');
  document.getElementById('placeHint').classList.remove('active');
}

// Проверка пересечения
function isOverlapping(x, y, excludeIdx = -1) {
  return state.buildings.some((b, i) => {
    if (i === excludeIdx) return false;
    const dx = Math.abs(b.x - x);
    const dy = Math.abs(b.y - y);
    return dx < 70 && dy < 35;
  });
}

function screenToWorld(sx, sy) {
  const cx = window.innerWidth / 2 + camera.x;
  const cy = window.innerHeight / 2 + camera.y + 100;
  return { x: sx - cx, y: sy - cy };
}

// ==================== ПОСТРОЙКА ====================
function confirmPlacement(screenX, screenY) {
  if (!placingMode) return;
  const w = screenToWorld(screenX, screenY);
  
  if (isOverlapping(w.x, w.y)) {
    showToast('❌ Здесь уже есть здание!');
    return;
  }
  
  const b = BUILDINGS[placingMode];
  for (let r in b.cost) {
    if (state[r] < b.cost[r]) { showToast('❌ Не хватает ресурсов!'); cancelPlacement(); return; }
  }
  for (let r in b.cost) state[r] -= b.cost[r];
  
  state.buildings.push({ type: placingMode, x: w.x, y: w.y, level: 1 });
  
  showToast(`✅ ${b.name} построен!`);
  cancelPlacement();
  renderWorld();
  updateUI();
  saveGame();
}

// ==================== УЛУЧШЕНИЕ ====================
function upgradeBuilding(index) {
  const b = state.buildings[index];
  const bDef = BUILDINGS[b.type];
  
  const mult = Math.pow(1.6, b.level);
  const cost = {
    wood: Math.floor((bDef.cost.wood || 0) * mult),
    stone: Math.floor((bDef.cost.stone || 0) * mult),
    gold: Math.floor((bDef.cost.gold || 0) * mult)
  };
  
  let canAfford = true;
  for (let r in cost) if (cost[r] > 0 && state[r] < cost[r]) canAfford = false;
  
  if (!canAfford) {
    showToast(`❌ Нужно: ${cost.wood ? '🪵'+cost.wood+' ' : ''}${cost.stone ? '🪨'+cost.stone+' ' : ''}${cost.gold ? '🪙'+cost.gold : ''}`);
    return;
  }
  
  for (let r in cost) if (cost[r] > 0) state[r] -= cost[r];
  b.level++;
  showToast(`⬆️ ${bDef.name} → ур. ${b.level}`);
  renderWorld();
  updateUI();
  saveGame();
}

// ==================== UI ====================
function updateUI() {
  document.getElementById('ui-food').textContent = Math.floor(state.food);
  document.getElementById('ui-wood').textContent = Math.floor(state.wood);
  document.getElementById('ui-stone').textContent = Math.floor(state.stone);
  document.getElementById('ui-gold').textContent = Math.floor(state.gold);
}

let toastTimeout;
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 2500);
}

function centerCamera() {
  camera.x = 0; camera.y = 0;
  renderWorld();
}

function resetGame() {
  if (confirm('Сбросить игру?')) {
    localStorage.removeItem('myHome_v4');
    state = { food: 500, wood: 500, stone: 200, gold: 100, buildings: [{ type: 'cityhall', x: 0, y: 0, level: 1 }] };
    camera = { x: 0, y: 0, isDragging: false, startX: 0, startY: 0, moved: false };
    renderWorld(); updateUI();
    showToast('🔄 Игра сброшена');
  }
}

// ==================== ЦИКЛ ====================
function gameTick() {
  let prod = { food: 0, wood: 0, stone: 0, gold: 0 };
  state.buildings.forEach(b => {
    const p = BUILDINGS[b.type].prod;
    for (let r in p) prod[r] += p[r] * b.level;
  });
  
  state.food += prod.food - state.buildings.length * 0.5;
  state.wood += prod.wood;
  state.stone += prod.stone;
  state.gold += prod.gold;
  
  if (state.food < 0) state.food = 0;
  updateUI();
}

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
function init() {
  loadGame();
  if (state.buildings.length === 0) {
    state.buildings.push({ type: 'cityhall', x: 0, y: 0, level: 1 });
  }
  
  // Земля с сеткой
  const ground = document.getElementById('ground');
  ground.innerHTML = '';
  // Здесь можно добавить декоративные элементы
  for (let i = 0; i < 15; i++) {
    const tree = document.createElement('div');
    tree.style.position = 'absolute';
    tree.style.left = Math.random() * 100 + '%';
    tree.style.top = Math.random() * 100 + '%';
    tree.style.fontSize = (20 + Math.random() * 15) + 'px';
    tree.style.opacity = '0.5';
    tree.style.pointerEvents = 'none';
    tree.textContent = Math.random() > 0.5 ? '🌲' : '🌳';
    ground.appendChild(tree);
  }
  
  renderWorld();
  updateUI();
  setInterval(gameTick, 1000);
  
  const world = document.getElementById('gameWorld');
  
  // Отслеживаем движение мыши для призрака и постановки
  world.addEventListener('mousemove', (e) => {
    if (!placingMode) return;
    ghostEl.style.left = e.clientX + 'px';
    ghostEl.style.top = e.clientY + 'px';
    
    const w = screenToWorld(e.clientX, e.clientY);
    if (isOverlapping(w.x, w.y)) {
      ghostEl.classList.add('invalid');
    } else {
      ghostEl.classList.remove('invalid');
    }
  });
  
  world.addEventListener('touchmove', (e) => {
    if (!placingMode) return;
    const t = e.touches[0];
    ghostEl.style.left = t.clientX + 'px';
    ghostEl.style.top = t.clientY + 'px';
    const w = screenToWorld(t.clientX, t.clientY);
    if (isOverlapping(w.x, w.y)) ghostEl.classList.add('invalid');
    else ghostEl.classList.remove('invalid');
  }, {passive: true});
  
  // Клик для постановки
  world.addEventListener('click', (e) => {
    if (camera.moved) { camera.moved = false; return; }
    if (placingMode) {
      confirmPlacement(e.clientX, e.clientY);
    }
  });
  
  world.addEventListener('touchend', (e) => {
    if (!placingMode) return;
    const t = e.changedTouches[0];
    confirmPlacement(t.clientX, t.clientY);
  });
  
  // Панорамирование (drag)
  world.addEventListener('mousedown', (e) => {
    if (placingMode) return;
    if (e.target.closest('.btn-circular')) return;
    camera.isDragging = true;
    camera.moved = false;
    camera.startX = e.clientX - camera.x;
    camera.startY = e.clientY - camera.y;
  });
  
  window.addEventListener('mousemove', (e) => {
    if (!camera.isDragging) return;
    const newX = e.clientX - camera.startX;
    const newY = e.clientY - camera.startY;
    if (Math.abs(newX - camera.x) > 3 || Math.abs(newY - camera.y) > 3) camera.moved = true;
    camera.x = newX; camera.y = newY;
    renderWorld();
  });
  window.addEventListener('mouseup', () => camera.isDragging = false);
  
  // Тач для панорамирования
  let touchStart = null;
  world.addEventListener('touchstart', (e) => {
    if (placingMode) return;
    const t = e.touches[0];
    camera.isDragging = true;
    camera.moved = false;
    camera.startX = t.clientX - camera.x;
    camera.startY = t.clientY - camera.y;
    touchStart = { x: t.clientX, y: t.clientY };
  }, {passive: true});
  
  window.addEventListener('touchmove', (e) => {
    if (!camera.isDragging || placingMode) return;
    const t = e.touches[0];
    const newX = t.clientX - camera.startX;
    const newY = t.clientY - camera.startY;
    if (touchStart && (Math.abs(t.clientX - touchStart.x) > 5 || Math.abs(t.clientY - touchStart.y) > 5)) {
      camera.moved = true;
    }
    camera.x = newX; camera.y = newY;
    renderWorld();
  }, {passive: true});
  
  window.addEventListener('touchend', () => camera.isDragging = false);
}

init();
</script>

</body>
</html>
